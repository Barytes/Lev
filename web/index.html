<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lev</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">L</div>
          <div>
            <h1>Lev</h1>
            <p>Human-centered document workspace</p>
          </div>
        </div>
        <div class="controls">
          <label>
            <span>Document</span>
            <select id="documentSelect"></select>
          </label>
          <button id="pauseButton" type="button" aria-pressed="false">Pause</button>
        </div>
      </header>

      <main class="workspace">
        <section class="editor-pane" aria-label="Document editor">
          <div class="pane-header">
            <span id="documentName">No document</span>
            <span id="saveState">Idle</span>
          </div>
          <textarea
            id="editor"
            spellcheck="false"
            placeholder="Open a Markdown or TXT document from this workspace."
          ></textarea>
        </section>

        <aside class="assist-pane" aria-label="Lev assistance">
          <div class="pane-header">
            <span>Lev assistance</span>
            <span id="assistState">Waiting</span>
          </div>
          <textarea id="assistance" readonly></textarea>
        </aside>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
